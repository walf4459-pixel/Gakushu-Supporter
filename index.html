<script type="text/plain" data-set="現代社会" data-name="現代社会の特色">

<script type="text/plain" data-set="地学" data-name="太陽と星の月周運動">

季節によって、同じ時刻に見られる星が変化することを何というか。 | 星の年周運動 同じ時刻の星の位置は、日周運動と同じ向きにどのように移動するか。 | 東から西へ移動する 同じ時刻の星の位置は、1か月で約何度移動するか。 | 約30° 同じ時刻の星の位置は、1日で約何度移動するか。 | 約1° 同じ位置に星が見られる時刻は、1か月で約何時間、どうなるか。 | 約2時間早くなる 星の年周運動の原因は何か。 | 地球が公転していること オリオン座が午後8時に南中するのは1月である。2月の午後8時には、オリオン座はどの向きに約何度移動した位置にあるか。 | 西へ約30°移動した位置 5月に午後8時に北斗七星がAの位置に見えるとき、同じ位置に見えるのは、4月には何時になるか。 | 午後6時 5月に午後8時にAの位置に見えた北斗七星が、同じ位置に見えるのは、6月には午後何時か。 | 午後10時 北斗七星などの北の空の星は、1か月に約30°ずつ、北極星を中心にどの向きに移動するか。 | 反時計回り 地球が公転している向きの軌道を何というか。 | 公転軌道 太陽が1年間かけて天球上を動いて見える、星座の間の通り道を何というか。 | 黄道 黄道上にある、おもな12の星座を何というか。 | 黄道12星座 太陽の見かけの動きが、星座の間を1年かけて一周する運動を何というか。 | 太陽の年周運動 太陽の年周運動は、星座の間を西から東、東から西のどちらに動くか。 | 西から東 太陽の年周運動で、太陽は1年間でどこに戻ってくるか。 | 同じ位置 地球がD(おとめ座の反対側)にあるとき、真夜中に南中する星座は、太陽がどの星座の方向に見えるときか。 | 太陽の反対側の星座 地球が公転しているために、季節によって太陽の方向にある星座がかわる。地球がB→C→Dと移動するとき、太陽の見える位置が通る星座を、順に答えよ。(おうし座→ふたご座→かに座の例) | おうし座→ふたご座→かに座→しし座の方向へ変わる 地球が公転面に垂直な方向に対して地軸を傾けたまま公転している。この地軸の傾きは、公転面に垂直な方向に対して約何度か。 | 23.4° 地軸の傾きのために、太陽の日周運動はどのように変化するか。 | 季節によって変化する 東京(北緯36°)での春分・秋分の日の、太陽の南中高度を求めよ。 | 54°(90°−36°) 東京(北緯36°)での夏至の日の、太陽の南中高度を求めよ。 | 77.4°(90°−36°+23.4°) 東京(北緯36°)での冬至の日の、太陽の南中高度を求めよ。 | 30.6°(90°−36°−23.4°) 太陽の南中高度の求め方で、春分・秋分の公式を答えよ。 | 90°−緯度 太陽の南中高度の求め方で、夏至の公式を答えよ。 | 90°−緯度+23.4° 太陽の南中高度の求め方で、冬至の公式を答えよ。 | 90°−緯度−23.4° 夏至の日の太陽の南中高度は、1年のうちで高いか低いか。 | 最も高い 冬至の日の太陽の南中高度は、1年のうちで高いか低いか。 | 最も低い 夏至の日の昼の長さは、1年のうちで長いか短いか。 | 最も長い 冬至の日の昼の長さは、1年のうちで長いか短いか。 | 最も短い 夏至の日の日の出の位置は、真東よりどちらにずれるか。 | 北寄り 冬至の日の日の出の位置は、真東よりどちらにずれるか。 | 南寄り 春分・秋分の日の日の出・日の入りの位置は、どこか。 | 真東・真西 太陽の南中高度や昼の長さが最大になる日と、気温が最も高くなる日は、同じ日か。 | 同じ日ではない(気温の変化は1〜2か月おくれる) 気温の変化が、太陽の南中高度や昼の長さの変化から1〜2か月おくれるのは何のためか。 | 地面や空気があたたまるのに時間がかかるため

 const add=()=>{const x=q.value.trim(),y=a.value.trim();if(!x||!y)return;s.qs.push({id:uid(),q:x,a:y,box:0,r:0,w:0});save();render()};
 const addBulk=()=>{const ps=parseLines(bulk.value);ps.forEach(p=>s.qs.push({id:uid(),q:p[0],a:p[1],box:0,r:0,w:0}));if(ps.length){save();render()}};
 return h('div',{},h('button',{class:'btn sm',on:{click:()=>go({t:'set',id:s.id})}},'← 演習画面へ'),h('h1',{},s.name+'：問題の編集'),
  ro?h('div',{class:'card mu'},'このデータはHTMLに内包されたテキストから読み込まれています。内容を変えるときはHTML内のデータ部分を書き換えてください（成績はこの端末に保存されます）。'):[drillCard(s),sheetCard(s)],
  ro?'':h('div',{class:'card'},h('h2',{},'問題を追加'),q,h('div',{style:'height:8px'}),a,h('div',{class:'row'},h('button',{class:'btn',on:{click:add}},'追加')),
   h('div',{class:'lb'},'まとめて追加'),bulk,h('div',{class:'row'},h('button',{class:'btn',on:{click:addBulk}},'まとめて追加'))),
  h('div',{class:'card'},h('h2',{},`問題一覧（${s.qs.length}）`),s.qs.map(x=>h('div',{class:'item'},h('div',{},plain(x.q),h('div',{class:'mu'},`→ ${x.a}　○${x.r} ×${x.w}`)),ro?'':h('button',{class:'btn sm',on:{click(){s.qs=s.qs.filter(z=>z!==x);save();render()}}},'削除')))),
  exportCard(s),
  ro?'':h('div',{class:'row'},twice('この問題集を削除',()=>{D.sets=D.sets.filter(z=>z!==s);save();go({t:'home'})},'ng')))
}
function canvasInit(cv){
 const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
 const c=cv.getContext('2d');c.scale(d,d);c.lineCap='round';c.lineJoin='round';return c}
function study(){
 const s=D.sets.find(z=>z.id===S.id),q=S.queue[S.i];
 const cv=h('canvas',{class:'cv'});let c,stack=[],on=false,er=false;
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.addEventListener('pointerdown',e=>{if(!c)return;e.preventDefault();cv.setPointerCapture(e.pointerId);stack.push(c.getImageData(0,0,cv.width,cv.height));if(stack.length>30)stack.shift();on=true;const[x,y]=pos(e);c.globalCompositeOperation=er?'destination-out':'source-over';c.strokeStyle=getComputedStyle(document.body).color;c.lineWidth=er?24:3;c.beginPath();c.moveTo(x,y);c.lineTo(x+.01,y);c.stroke()});
 cv.addEventListener('pointermove',e=>{if(!on)return;e.preventDefault();const[x,y]=pos(e);c.lineTo(x,y);c.stroke();c.beginPath();c.moveTo(x,y)});
 ['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>{on=false}));
 const clr=()=>{stack.push(c.getImageData(0,0,cv.width,cv.height));c.save();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.restore()};
 const undo=()=>{const im=stack.pop();if(im)c.putImageData(im,0,0)};
 const erb=h('button',{class:'btn sm',on:{click(){er=!er;erb.textContent=er?'✏️ ペンに戻す':'🩹 消しゴム'}}},'🩹 消しゴム');
 const ans=h('div',{class:'card',hidden:true},h('div',{class:'lb'},'答え'),h('div',{class:'big'},q.a));
 const fin=ok=>{if(ok){q.r++;q.box=Math.min(q.box+1,5);S.ok++}else{q.w++;q.box=0;S.ng++}save();S.i++;go({t:S.i>=S.queue.length?'done':'study'})};
 const judge=h('div',{class:'row',hidden:true},h('button',{class:'btn ng',on:{click:()=>fin(false)}},'× 間違い'),h('button',{class:'btn ok',on:{click:()=>fin(true)}},'○ 正解'));
 const show=h('button',{class:'btn pri',style:'width:100%',on:{click(){ans.hidden=false;judge.hidden=false;show.hidden=true}}},'答えを見る');
 requestAnimationFrame(()=>{c=canvasInit(cv)});
 return h('div',{},h('div',{class:'row'},h('button',{class:'btn sm',on:{click:()=>go({t:'set',id:S.id})}},'← やめる'),h('div',{class:'mu',style:'text-align:right'},`${S.i+1} / ${S.queue.length}`)),
  h('div',{class:'bar'},h('i',{style:`width:${S.i/S.queue.length*100}%`})),
  h('div',{class:'card'},h('div',{class:'lb'},s.name),h('div',{class:'big'},fmt(q.q))),
  cv,h('div',{class:'row'},h('button',{class:'btn sm',on:{click:undo}},'↩ 元に戻す'),erb,h('button',{class:'btn sm',on:{click:clr}},'全消し')),
  show,ans,judge)
}
function done(){
 const s=D.sets.find(z=>z.id===S.id),n=S.ok+S.ng;
 const again=h('button',{class:'btn pri',on:{click(){const p=weak(s);if(!p.length)return go({t:'set',id:s.id});S={id:s.id,queue:p,i:0,ok:0,ng:0};go({t:'study'})}}},'苦手だけもう一度');
 return h('div',{},h('h1',{},'おつかれさま 🎉'),h('div',{class:'card'},h('div',{class:'big'},`${S.ok} / ${n} 問 正解`),h('div',{class:'mu'},`正答率 ${n?Math.round(S.ok/n*100):0}%`)),
  pie(s),
  h('div',{class:'row'},again,h('button',{class:'btn',on:{click:()=>go({t:'set',id:s.id})}},'問題集に戻る')))
}
loadBundled();render();
